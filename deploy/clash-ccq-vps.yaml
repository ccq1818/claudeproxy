# ccq 三出口（每个节点 = 一台独立代理，socks5 over TLS @443，ClashX 直连）
port: 7890
socks-port: 7891
external-controller: 127.0.0.1:9090
mode: rule
log-level: info
proxies:
  - { name: "vps-129", type: socks5, server: 104.223.81.129, port: 443, username: cpx, password: d221ea9e1fbae90a, tls: true, skip-cert-verify: true, udp: true }
  - { name: "vps-130", type: socks5, server: 104.223.81.130, port: 443, username: cpx, password: d221ea9e1fbae90a, tls: true, skip-cert-verify: true, udp: true }
  - { name: "vps-131", type: socks5, server: 104.223.81.131, port: 443, username: cpx, password: d221ea9e1fbae90a, tls: true, skip-cert-verify: true, udp: true }
proxy-groups:
  - { name: "出口", type: select, proxies: ["vps-129", "vps-130", "vps-131", DIRECT] }
rules:
  - MATCH,出口
